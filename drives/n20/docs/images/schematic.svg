<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 860" role="img" aria-label="Schematic, rev C.6. Power: PD board 5 volt output to the DRV8833 VCC pin and through diode D1 to the ESP32-C6 Super Mini 5V pin; 470 microfarad capacitor C1 across the 5 volt supply; a second 470 microfarad capacitor C3 from D1's cathode to ground, so it can only feed the Super Mini through a motor start or stall; all grounds common. Drive: Super Mini GPIO18 to DRV8833 IN3, GPIO20 to IN4, GPIO19 to the sleep pin EEP (channel B of the module); DRV8833 OUT3 and OUT4 are the nets MOT_A and MOT_B, with a 0.1 microfarad capacitor C2 across them on the perfboard. Motor and encoder: the 6-pin plug J4 on the motor's encoder board carries MOT_A to pin 1 (M1) and MOT_B to pin 6 (M2) of the N20 motor M1 (6 volt, 1:150), and GND to pin 2, ENC_A to pin 3 (C1), ENC_B to pin 4 (C2) and plus 3.3 volts to pin 5 (VCC) of the Hall encoder ENC1. ENC_A is GPIO0 and ENC_B is GPIO2. Controls: 12 millimetre stainless push button S1 from GPIO1 to ground; 10 kilohm speed knob RV1 (an RK097N on the perfboard) between 3.3 volts and GPIO3, which the firmware drives low as the knob's ground, with its wiper to GPIO4; no direction switch, so the motor runs forward. The PD board, the Super Mini, the DRV8833, D1, C1, C2, C3 and the knob are on a perfboard; the motor's cable is soldered to it. On a XIAO ESP32-C6 the same nets use D10, D9, D8 and D1 to D4, the knob's low end goes to ground, and there is no encoder input. The button's two wires run straight to the perfboard; there's no connector, so the pod doesn't unplug."><style>.grid{stroke:#e9eeed;stroke-width:1}
.w-pwr{stroke:#c23b2a;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.w-gnd{stroke:#2f3a3d;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.w-sig{stroke:#d07a1c;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.dot-pwr{fill:#c23b2a}
.dot-gnd{fill:#2f3a3d}
.w-ctl{stroke:#1f6670;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.net.c{fill:#1f6670}
.sect{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;letter-spacing:.12em;fill:#5d6b6e}
.divider{stroke:#d5dddc;stroke-width:1.5;stroke-dasharray:6 6}
.contact{fill:#ffffff;stroke:#1c2729;stroke-width:2}
.part{fill:#eef4f4;stroke:#1f6670;stroke-width:2}
.sym{fill:none;stroke:#1c2729;stroke-width:2.2;stroke-linejoin:round}
.symfill{fill:#1c2729;stroke:#1c2729;stroke-width:1.5}
.ref{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-size:15px;font-weight:600;fill:#1f6670}
.name{font-family:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;font-size:16px;font-weight:600;fill:#1c2729}
.small{font-family:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;font-size:13px;fill:#5d6b6e}
.pin{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;fill:#1c2729}
.net{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;font-weight:600}
.net.p{fill:#c23b2a}
.net.g{fill:#2f3a3d}
.net.s{fill:#d07a1c}
.tb{fill:#ffffff;stroke:#d5dddc;stroke-width:1.5}
.tbt{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;fill:#5d6b6e}
.tbv{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;font-weight:600;fill:#1c2729}
.pad{stroke:#1c2729;stroke-width:1.5}
.padoff{fill:#ffffff;stroke:#5d6b6e;stroke-width:1.2}
.board{fill:#eef4f4;stroke:#1f6670;stroke-width:2}
.lbl{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;fill:#1c2729}
.lblm{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;fill:#5d6b6e}
.ttl{font-family:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;font-size:15px;font-weight:600;fill:#1c2729}
text{font-family:'IBM Plex Sans',Helvetica,Arial,sans-serif}</style><rect x="0" y="0" width="1180" height="860" fill="#ffffff"/>
        <defs>
          <pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" class="grid" fill="none"/></pattern>
        </defs>
        <rect x="0" y="0" width="1180" height="860" fill="url(#g)"/>
        <text class="sect" x="24" y="40">POWER &amp; DRIVE</text>

        <!-- rails -->
        <path class="w-pwr" d="M270 110 H1140"/>
        <path class="w-gnd" d="M262 480 H1140"/>
        <text class="net p" x="600" y="98">+5V</text>
        <text class="net g" x="600" y="505">GND</text>

        <!-- USB-C input -->
        <text class="small" x="24" y="126">USB-C PD charger</text>
        <text class="small" x="24" y="143">(5 V / 3 A capable)</text>
        <path class="sym" d="M40 240 H90"/><path class="symfill" d="M90 234 L102 240 L90 246 Z"/>

        <!-- U1 PD board -->
        <rect class="part" x="104" y="200" width="146" height="190" rx="6"/>
        <text class="ref" x="116" y="228">U1</text>
        <text class="name" x="116" y="262">USB-C PD</text>
        <text class="name" x="116" y="282">trigger board</text>
        <text class="small" x="116" y="304">set to 5 V;</text>
        <text class="small" x="116" y="321">terminal removed</text>
        <text class="pin" x="242" y="346" text-anchor="end">OUT+</text>
        <text class="pin" x="242" y="378" text-anchor="end">OUT−</text>
        <path class="w-pwr" d="M250 342 H270 V110"/>
        <path class="w-gnd" d="M250 374 H262 V480"/>

        <!-- D1 schottky: anode at rail, cathode (bar) toward XIAO 5V -->
        <path class="w-pwr" d="M380 110 V176"/>
        <path class="sym" d="M366 176 H394 L380 202 Z"/>
        <path class="sym" d="M366 204 H394"/>
        <path class="sym" d="M366 204 v-5 M394 204 v5"/>
        <path class="w-pwr" d="M380 204 V270 H440"/>
        <text class="ref" x="404" y="186">D1</text>
        <text class="small" x="404" y="204">SS14 / 1N5817</text>
        <text class="small" x="404" y="221">Schottky</text>
        <circle class="dot-pwr" cx="380" cy="110" r="5"/>

        <!-- C3 hold-up capacitor on the Super Mini side of D1: D1 stops it feeding the motor rail -->
        <path class="w-pwr" d="M380 240 H320 V300"/>
        <path class="sym" d="M300 300 H340"/>
        <path class="sym" d="M300 316 Q320 306 340 316"/>
        <path class="w-gnd" d="M320 312 V480"/>
        <circle class="dot-pwr" cx="380" cy="240" r="5"/>
        <circle class="dot-gnd" cx="320" cy="480" r="5"/>
        <text class="pin" x="296" y="296" text-anchor="end">+</text>
        <text class="ref" x="346" y="300">C3</text>
        <text class="small" x="346" y="317">470 µF</text>

        <!-- U2 XIAO ESP32-C6 -->
        <rect class="part" x="440" y="240" width="190" height="200" rx="6"/>
        <text class="ref" x="535" y="232" text-anchor="middle">U2</text>
        <text class="name" x="455" y="366">ESP32-C6</text>
        <text class="name" x="455" y="385">Super Mini</text>
        <text class="small" x="455" y="403">USB-C: programming</text>
        <text class="pin" x="450" y="274">5V</text>
        <text class="pin" x="450" y="334">3V3</text>
        <text class="pin" x="450" y="424">GND</text>
        <text class="pin" x="620" y="274" text-anchor="end">GPIO18</text>
        <text class="pin" x="620" y="299" text-anchor="end">GPIO20</text>
        <text class="pin" x="620" y="324" text-anchor="end">GPIO19</text>
        <text class="pin" x="620" y="344" text-anchor="end">GPIO1</text>
        <text class="pin" x="620" y="362" text-anchor="end">GPIO4</text>
        <text class="pin" x="620" y="380" text-anchor="end">GPIO3</text>
        <text class="pin" x="620" y="398" text-anchor="end">GPIO2</text>
        <text class="pin" x="620" y="416" text-anchor="end">GPIO0</text>
        <path class="w-gnd" d="M440 420 H380 V480"/>
        <circle class="dot-gnd" cx="380" cy="480" r="5"/>
        <!-- 3V3 out to the speed knob -->
        <path class="w-ctl" d="M440 330 H414"/>
        <text class="net c" x="408" y="335" text-anchor="end">+3V3</text>
        <!-- control nets -->
        <path class="w-ctl" d="M630 340 H690 M630 358 H690 M630 376 H690"/>
        <text class="net c" x="696" y="345">BTN</text>
        <text class="net c" x="696" y="363">SPEED</text>
        <text class="net c" x="696" y="381">KNOB_LO</text>
        <!-- GPIO2 / GPIO0: the motor's Hall encoder (C.6) -->
        <path class="w-ctl" d="M630 394 H690 M630 412 H690"/>
        <text class="net c" x="696" y="399">ENC_B</text>
        <text class="net c" x="696" y="417">ENC_A</text>

        <!-- XIAO to the DRV8833 inputs -->
        <path class="w-sig" d="M630 270 H790 M630 295 H790 M630 320 H790"/>
        <text class="net s" x="712" y="264">MOT_IN1</text>
        <text class="net s" x="712" y="289">MOT_IN2</text>
        <text class="net s" x="712" y="314">DRV_SLEEP</text>

        <!-- U3 DRV8833 module, channel B (IN3/IN4 -> OUT3/OUT4) -->
        <rect class="part" x="790" y="240" width="130" height="200" rx="6"/>
        <text class="ref" x="796" y="232">U3</text>
        <text class="pin" x="798" y="274">IN3</text>
        <text class="pin" x="798" y="299">IN4</text>
        <text class="pin" x="798" y="324">EEP</text>
        <text class="pin" x="912" y="324" text-anchor="end">OUT3</text>
        <text class="pin" x="912" y="414" text-anchor="end">OUT4</text>
        <text class="pin" x="855" y="258" text-anchor="middle">VCC</text>
        <text class="pin" x="855" y="432" text-anchor="middle">GND</text>
        <text class="name" x="800" y="366">DRV8833</text>
        <text class="small" x="800" y="384">module</text>
        <text class="small" x="800" y="401">ch. B · J1 open</text>
        <path class="w-pwr" d="M855 110 V240"/>
        <path class="w-gnd" d="M855 440 V480"/>
        <circle class="dot-pwr" cx="855" cy="110" r="5"/>
        <circle class="dot-gnd" cx="855" cy="480" r="5"/>

        <!-- C2 across the motor outputs, on the perfboard (C.6: the encoder board covers the motor's terminals) -->
        <path class="w-sig" d="M920 320 H1000 M920 410 H1000 M950 320 V357 M950 373 V410"/>
        <path class="sym" d="M936 357 H964 M936 373 H964"/>
        <circle class="symfill" cx="950" cy="320" r="4"/>
        <circle class="symfill" cx="950" cy="410" r="4"/>
        <text class="ref" x="970" y="362">C2</text>
        <text class="small" x="970" y="379">0.1 µF</text>
        <text class="net s" x="1004" y="325">MOT_A</text>
        <text class="net s" x="1004" y="415">MOT_B</text>

        <!-- C1 bulk capacitor across the supply -->
        <path class="w-pwr" d="M1140 110 V200"/>
        <path class="sym" d="M1120 200 H1160"/>
        <path class="sym" d="M1120 216 Q1140 206 1160 216"/>
        <text class="pin" x="1114" y="196" text-anchor="end">+</text>
        <path class="w-gnd" d="M1140 212 V480"/>
        <text class="ref" x="1128" y="150" text-anchor="end">C1</text>
        <text class="small" x="1128" y="168" text-anchor="end">470 µF ≥10 V</text>

        <!-- Perfboard outline (rev C): U1, U2, U3, D1, C3, RV1 and (C.6) C2 are on the ElectroCookie board, and from C.3 C1 too (second outline) -->
        <rect x="92" y="150" width="910" height="305" rx="10" fill="none" stroke="#1f6670" stroke-width="1.5" stroke-dasharray="8 6"/>
        <text class="lblm" x="636" y="448">PERFBOARD (docs/perfboard.md)</text>
        <rect x="1022" y="134" width="150" height="96" rx="10" fill="none" stroke="#1f6670" stroke-width="1.5" stroke-dasharray="8 6"/>
        <text class="small" x="1166" y="246" text-anchor="end">on the perfboard</text>
        <text class="small" x="24" y="500">On a XIAO ESP32-C6:</text>
        <text class="small" x="24" y="517">D10, D9, D8 = GPIO18, 20, 19;</text>
        <text class="small" x="24" y="534">D1–D4 = BTN, SPEED, FWD, REV;</text>
        <text class="small" x="24" y="551">RV1's low end to GND; no encoder.</text>

        <!-- Ground symbol -->
        <path class="w-gnd" d="M560 480 V500"/>
        <path class="sym" d="M544 500 H576 M550 507 H570 M556 514 H564"/>

        <!-- ===== Control panel ===== -->
        <path class="divider" d="M24 562 H1156"/>
        <text class="sect" x="24" y="586">CONTROLS · MOTOR · S1 wired straight to the perfboard · RV1 on the perfboard · J4 at the motor · no direction switch</text>

        <!-- S1 push button: BTN to GND -->
        <text class="net c" x="40" y="665">BTN</text>
        <path class="w-ctl" d="M84 660 H140"/>
        <circle class="contact" cx="146" cy="660" r="5"/>
        <circle class="contact" cx="196" cy="660" r="5"/>
        <path class="sym" d="M136 640 H206 M171 640 V622"/>
        <path class="w-gnd" d="M202 660 H240 V690"/>
        <path class="sym" d="M224 690 H256 M230 697 H250 M236 704 H244"/>
        <text class="ref" x="146" y="610">S1</text>
        <text class="small" x="120" y="735">12 mm push button (N.O.)</text>
        <text class="small" x="120" y="752">stainless, pre-wired leads</text>
        <text class="small" x="120" y="769">start · pause · next</text>

        <!-- RV1 speed knob: 3V3 / wiper to SPEED / KNOB_LO (GPIO3 driven low) -->
        <text class="net c" x="420" y="604" text-anchor="middle">+3V3</text>
        <path class="w-ctl" d="M420 612 V632"/>
        <rect class="sym" x="410" y="632" width="20" height="60"/>
        <path class="w-ctl" d="M420 692 V712"/>
        <text class="net c" x="420" y="730" text-anchor="middle">KNOB_LO</text>
        <path class="w-ctl" d="M480 662 H440"/>
        <path class="symfill" d="M440 656 L430 662 L440 668 Z"/>
        <text class="net c" x="488" y="667">SPEED</text>
        <text class="ref" x="350" y="640">RV1</text>
        <text class="small" x="326" y="660">10 kΩ</text>
        <text class="small" x="326" y="677">linear</text>
        <text class="small" x="350" y="752">Speed knob, RK097N, on the perfboard:</text>
        <text class="small" x="350" y="769">pins straight into the GPIO4 / GPIO3 strips</text>

        <!-- J4: the 6-pin socket on the motor's encoder board; its cable is soldered to the perfboard (W24-W29, C.6) -->
        <rect class="part" x="840" y="606" width="22" height="128" rx="3"/>
        <text class="ref" x="836" y="600">J4</text>
        <path class="w-sig" d="M806 620 H840 M806 720 H840"/>
        <path class="w-gnd" d="M806 640 H840"/>
        <path class="w-ctl" d="M806 660 H840 M806 680 H840 M806 700 H840"/>
        <text class="net s" x="800" y="625" text-anchor="end">MOT_A</text>
        <text class="net g" x="800" y="645" text-anchor="end">GND</text>
        <text class="net c" x="800" y="665" text-anchor="end">ENC_A</text>
        <text class="net c" x="800" y="685" text-anchor="end">ENC_B</text>
        <text class="net c" x="800" y="705" text-anchor="end">+3V3</text>
        <text class="net s" x="800" y="725" text-anchor="end">MOT_B</text>
        <text class="pin" x="851" y="624" text-anchor="middle">1</text>
        <text class="pin" x="851" y="644" text-anchor="middle">2</text>
        <text class="pin" x="851" y="664" text-anchor="middle">3</text>
        <text class="pin" x="851" y="684" text-anchor="middle">4</text>
        <text class="pin" x="851" y="704" text-anchor="middle">5</text>
        <text class="pin" x="851" y="724" text-anchor="middle">6</text>
        <!-- M1: the N20 between pins 1 and 6 -->
        <path class="w-sig" d="M862 620 H1060 V646 M862 720 H1060 V694"/>
        <circle class="sym" cx="1060" cy="670" r="24"/>
        <text class="name" x="1060" y="676" text-anchor="middle">M</text>
        <text class="ref" x="1092" y="652">M1</text>
        <text class="small" x="1092" y="670">N20, 6 V</text>
        <text class="small" x="1092" y="687">1:150</text>
        <!-- ENC1: the Hall encoder on the motor's shaft, pins 2-5 -->
        <path class="w-gnd" d="M862 640 H912"/>
        <path class="w-ctl" d="M862 660 H912 M862 680 H912 M862 700 H912"/>
        <rect class="part" x="912" y="630" width="96" height="80" rx="4"/>
        <text class="pin" x="918" y="644">GND</text>
        <text class="pin" x="918" y="664">C1 · A</text>
        <text class="pin" x="918" y="684">C2 · B</text>
        <text class="pin" x="918" y="704">VCC</text>
        <path class="divider" d="M1008 670 H1036"/>
        <text class="ref" x="912" y="752">ENC1</text>
        <text class="small" x="958" y="752">Hall encoder, 3.3 V only</text>
        <text class="small" x="912" y="769">4200 counts per output turn (x4)</text>
        <text class="small" x="620" y="752">J4: the encoder's socket;</text>
        <text class="small" x="620" y="769">cable soldered to the perfboard</text>

        <!-- Title block -->
        <rect class="tb" x="680" y="790" width="480" height="56"/>
        <path d="M680 818 H1160 M940 790 V846" stroke="#d5dddc" stroke-width="1.5"/>
        <text class="tbt" x="692" y="809">TITLE</text>
        <text class="tbv" x="746" y="809">Cam Rotation N20</text>
        <text class="tbt" x="952" y="809">REV</text>
        <text class="tbv" x="990" y="809">C.6 · 2026-11-08</text>
        <text class="tbt" x="692" y="837">SUPPLY</text>
        <text class="tbv" x="752" y="837">5 V USB-C PD</text>
        <text class="tbt" x="952" y="837">MCU</text>
        <text class="tbv" x="990" y="837">ESP32-C6 Super Mini</text>
      </svg>