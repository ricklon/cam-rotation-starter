<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 434" role="img" aria-label="Which leg of C1 is which, and how it stands. The 470 µF can is blue with a light stripe down one side, marked with minus signs. The leg on the stripe side is minus and goes to B4; the other leg is plus, the longer one on a new part, and goes to C7. Seen from the side, the can stands 1.5 mm off the board with both legs sleeved and bent out to their holes.">
<rect width="600" height="434" fill="#ffffff"/>
<text x="24" y="34" font-family="IBM Plex Sans,ui-sans-serif,system-ui,sans-serif" font-size="20" fill="#1c2729" font-weight="700">C1 · 470 µF: which leg is which</text>
<rect x="230" y="70" width="120" height="190" rx="12" fill="#1e3c8c"/>
<rect x="230" y="70" width="38" height="190" fill="#c8c8cd"/>
<text x="249" y="110" font-family="IBM Plex Sans,ui-sans-serif,system-ui,sans-serif" font-size="26" fill="#1c2729" font-weight="700" text-anchor="middle">−</text>
<text x="249" y="156" font-family="IBM Plex Sans,ui-sans-serif,system-ui,sans-serif" font-size="26" fill="#1c2729" font-weight="700" text-anchor="middle">−</text>
<text x="249" y="202" font-family="IBM Plex Sans,ui-sans-serif,system-ui,sans-serif" font-size="26" fill="#1c2729" font-weight="700" text-anchor="middle">−</text>
<text x="249" y="248" font-family="IBM Plex Sans,ui-sans-serif,system-ui,sans-serif" font-size="26" fill="#1c2729" font-weight="700" text-anchor="middle">−</text>
<line x1="260" y1="260" x2="260" y2="310" stroke="#8d8d96" stroke-width="5"/>
<line x1="320" y1="260" x2="320" y2="340" stroke="#8d8d96" stroke-width="5"/>
<text x="216" y="304" font-family="IBM Plex Sans,ui-sans-serif,system-ui,sans-serif" font-size="20" fill="#1c2729" font-weight="700" text-anchor="end">− → B4</text>
<text x="216" y="326" font-family="IBM Plex Sans,ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#1c2729" text-anchor="end">stripe side</text>
<text x="334" y="322" font-family="IBM Plex Sans,ui-sans-serif,system-ui,sans-serif" font-size="20" fill="#1c2729" font-weight="700">+ → C7</text>
<text x="334" y="344" font-family="IBM Plex Sans,ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#1c2729" >the long leg</text>
<line x1="226" y1="160" x2="200" y2="160" stroke="#d4147a" stroke-width="2.5"/>
<text x="194" y="166" font-family="IBM Plex Sans,ui-sans-serif,system-ui,sans-serif" font-size="18"  font-weight="700" text-anchor="end" fill="#d4147a">stripe = −</text>
<text x="24" y="388" font-family="IBM Plex Sans,ui-sans-serif,system-ui,sans-serif" font-size="16" fill="#1c2729" >Go by the stripe, not the leg length: the legs may be cut.</text>
<text x="24" y="412" font-family="IBM Plex Sans,ui-sans-serif,system-ui,sans-serif" font-size="16" fill="#1c2729" font-weight="700">Sleeve both legs; stand it 1.5 mm up, stripe toward row 4.</text>
</svg>
