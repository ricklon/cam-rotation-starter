<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 330" role="img" aria-label="Pin maps. XIAO ESP32-C6 top view with USB-C at the top: left column D0 to D6, right column 5V, GND, 3V3, D10, D9, D8, D7; used pins colored by wire. Knob pins 1, 2, 3 left to right from the front with pins down. Switch outer pin A, center, outer pin B. Button two legs. Servo plug brown, red, orange. PD board screw terminals plus and GND."><style>.grid{stroke:#e9eeed;stroke-width:1}
.w-pwr{stroke:#c23b2a;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.w-gnd{stroke:#2f3a3d;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.w-sig{stroke:#d07a1c;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.dot-pwr{fill:#c23b2a}
.dot-gnd{fill:#2f3a3d}
.w-ctl{stroke:#1f6670;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.net.c{fill:#1f6670}
.sect{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;letter-spacing:.12em;fill:#5d6b6e}
.divider{stroke:#d5dddc;stroke-width:1.5;stroke-dasharray:6 6}
.contact{fill:#ffffff;stroke:#1c2729;stroke-width:2}
.part{fill:#eef4f4;stroke:#1f6670;stroke-width:2}
.sym{fill:none;stroke:#1c2729;stroke-width:2.2;stroke-linejoin:round}
.symfill{fill:#1c2729;stroke:#1c2729;stroke-width:1.5}
.ref{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-size:15px;font-weight:600;fill:#1f6670}
.name{font-family:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;font-size:16px;font-weight:600;fill:#1c2729}
.small{font-family:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;font-size:13px;fill:#5d6b6e}
.pin{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;fill:#1c2729}
.net{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;font-weight:600}
.net.p{fill:#c23b2a}
.net.g{fill:#2f3a3d}
.net.s{fill:#d07a1c}
.tb{fill:#ffffff;stroke:#d5dddc;stroke-width:1.5}
.tbt{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;fill:#5d6b6e}
.tbv{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;font-weight:600;fill:#1c2729}
.pad{stroke:#1c2729;stroke-width:1.5}
.padoff{fill:#ffffff;stroke:#5d6b6e;stroke-width:1.2}
.board{fill:#eef4f4;stroke:#1f6670;stroke-width:2}
.lbl{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;fill:#1c2729}
.lblm{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;fill:#5d6b6e}
.ttl{font-family:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;font-size:15px;font-weight:600;fill:#1c2729}
text{font-family:'IBM Plex Sans',Helvetica,Arial,sans-serif}</style><rect x="0" y="0" width="1060" height="330" fill="#ffffff"/><text class="ttl" x="20" y="24">XIAO ESP32-C6 · top view</text><rect class="board" x="70" y="56" width="150" height="250" rx="12"/><rect class="padoff" x="122" y="40" width="46" height="26" rx="5"/><text class="lblm" x="145" y="90" text-anchor="middle">USB-C</text><circle class="pad" cx="84" cy="84" r="7" fill="#e08a1e"/><text class="lbl" x="62" y="88" text-anchor="end">D0</text><circle class="pad" cx="84" cy="116" r="7" fill="#f4f4f2"/><text class="lbl" x="62" y="120" text-anchor="end">D1</text><circle class="pad" cx="84" cy="148" r="7" fill="#e6c229"/><text class="lbl" x="62" y="152" text-anchor="end">D2</text><circle class="pad" cx="84" cy="180" r="7" fill="#2f9e44"/><text class="lbl" x="62" y="184" text-anchor="end">D3</text><circle class="pad" cx="84" cy="212" r="7" fill="#2f6fd6"/><text class="lbl" x="62" y="216" text-anchor="end">D4</text><circle class="padoff" cx="84" cy="244" r="7"/><text class="lbl" x="62" y="248" text-anchor="end">D5</text><circle class="padoff" cx="84" cy="276" r="7"/><text class="lbl" x="62" y="280" text-anchor="end">D6</text><circle class="pad" cx="206" cy="84" r="7" fill="#d23c2b"/><text class="lbl" x="228" y="88">5V (VIN)</text><circle class="pad" cx="206" cy="116" r="7" fill="#1f2224"/><text class="lbl" x="228" y="120">GND</text><circle class="pad" cx="206" cy="148" r="7" fill="#7d4fc0"/><text class="lbl" x="228" y="152">3V3</text><circle class="padoff" cx="206" cy="180" r="7"/><text class="lbl" x="228" y="184">D10</text><circle class="padoff" cx="206" cy="212" r="7"/><text class="lbl" x="228" y="216">D9</text><circle class="padoff" cx="206" cy="244" r="7"/><text class="lbl" x="228" y="248">D8</text><circle class="padoff" cx="206" cy="276" r="7"/><text class="lbl" x="228" y="280">D7</text><text class="ttl" x="330" y="24">U1 PD board terminals</text><rect class="board" x="330" y="56" width="150" height="110" rx="8"/><rect class="pad" x="350" y="80" width="40" height="40" rx="4" fill="#d23c2b"/><text class="lbl" x="370" y="140" text-anchor="middle">+</text><rect class="pad" x="420" y="80" width="40" height="40" rx="4" fill="#1f2224"/><text class="lbl" x="440" y="140" text-anchor="middle">GND</text><text class="lblm" x="330" y="190">3 wires per terminal: twist and</text><text class="lblm" x="330" y="206">tin, or use one bootlace ferrule</text><text class="ttl" x="330" y="246">MG90S plug</text><rect class="pad" x="340" y="262" width="30" height="22" rx="3" fill="#7a4a2a"/><text class="lblm" x="355" y="304" text-anchor="middle">GND</text><rect class="pad" x="384" y="262" width="30" height="22" rx="3" fill="#d23c2b"/><text class="lblm" x="399" y="304" text-anchor="middle">+</text><rect class="pad" x="428" y="262" width="30" height="22" rx="3" fill="#e08a1e"/><text class="lblm" x="443" y="304" text-anchor="middle">CTRL</text><text class="ttl" x="560" y="24">RV1 speed knob · front, pins down</text><rect class="board" x="580" y="56" width="150" height="90" rx="8"/><circle class="padoff" cx="655" cy="101" r="22"/><rect class="pad" x="605" y="146" width="10" height="26" fill="#1f2224"/><text class="lbl" x="610" y="190" text-anchor="middle">1</text><text class="lblm" x="610" y="206" text-anchor="middle">GND</text><rect class="pad" x="650" y="146" width="10" height="26" fill="#e6c229"/><text class="lbl" x="655" y="190" text-anchor="middle">2</text><text class="lblm" x="655" y="206" text-anchor="middle">SPEED</text><rect class="pad" x="695" y="146" width="10" height="26" fill="#7d4fc0"/><text class="lbl" x="700" y="190" text-anchor="middle">3</text><text class="lblm" x="700" y="206" text-anchor="middle">3V3</text><text class="lblm" x="580" y="232">Clockwise moves the</text><text class="lblm" x="580" y="248">wiper toward pin 3,</text><text class="lblm" x="580" y="264">so clockwise = faster.</text><text class="ttl" x="820" y="24">SW1 direction · ON-OFF-ON</text><rect class="board" x="840" y="56" width="150" height="70" rx="8"/><rect class="pad" x="864" y="126" width="12" height="26" fill="#2f9e44"/><text class="lbl" x="870" y="170" text-anchor="middle">A</text><text class="lblm" x="870" y="186" text-anchor="middle">FWD</text><rect class="pad" x="909" y="126" width="12" height="26" fill="#1f2224"/><text class="lbl" x="915" y="170" text-anchor="middle">C</text><text class="lblm" x="915" y="186" text-anchor="middle">GND</text><rect class="pad" x="954" y="126" width="12" height="26" fill="#2f6fd6"/><text class="lbl" x="960" y="170" text-anchor="middle">B</text><text class="lblm" x="960" y="186" text-anchor="middle">REV</text><text class="lblm" x="840" y="208">Center connects to the</text><text class="lblm" x="840" y="224">pin opposite the lever.</text><text class="ttl" x="820" y="262">S1 button</text><rect class="pad" x="854" y="276" width="12" height="24" fill="#f4f4f2"/><text class="lblm" x="860" y="318" text-anchor="middle">A · BTN</text><rect class="pad" x="924" y="276" width="12" height="24" fill="#1f2224"/><text class="lblm" x="930" y="318" text-anchor="middle">B · GND</text></svg>