<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f6b3f">
  <title>CamBox</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <header class="top">
    <div class="brand"><img src="./icon.svg" alt="" width="28" height="28"><span>CamBox</span></div>
    <div id="conn" class="conn" role="status">Connecting…</div>
  </header>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="play" aria-selected="true">Play</button>
    <button role="tab" data-tab="stories" aria-selected="false">Stories</button>
    <button role="tab" data-tab="settings" aria-selected="false">Settings</button>
  </nav>
  <main id="app"></main>
  <div id="toast" class="toast" role="status" hidden></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
